<svg xmlns="http://www.w3.org/2000/svg" width="620" height="405" viewBox="0 50 620 405" role="img" aria-labelledby="title desc">
<title id="title">AutoEIS: impedance measurements to circuit model and parameter uncertainty</title>
<desc id="desc">A minimal three-stage diagram. Measured Nyquist impedance data flow into a gene expression programming circuit-expression tree. The output is an equivalent circuit alongside a Bayesian posterior distribution.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#eff4f1"/><stop offset="1" stop-color="#e4ede8"/></linearGradient>
  <linearGradient id="mid" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fffdfb"/><stop offset="1" stop-color="#fff7f3"/></linearGradient>
  <linearGradient id="curve" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c26242" stop-opacity=".33"/><stop offset="1" stop-color="#c26242" stop-opacity=".035"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24483f" flood-opacity=".045"/></filter>
</defs>
<rect width="620" height="538" fill="url(#bg)"/>
<path d="M0 481 C100 450 169 509 291 479 S510 451 620 491" stroke="#d7e4dd" stroke-width="2" fill="none"/>
<path d="M0 507 C121 483 201 527 328 510 S508 490 620 516" stroke="#e1ebe6" stroke-width="1.5" fill="none"/>

<!-- Three sparse, equally weighted visual stations. -->
<g filter="url(#shadow)">
  <rect x="23" y="71" width="174" height="362" rx="17" fill="#ffffff" stroke="#cadbd4" stroke-width="1.5"/>
  <rect x="230" y="71" width="160" height="362" rx="17" fill="url(#mid)" stroke="#e3d5ce" stroke-width="1.5"/>
  <rect x="423" y="71" width="174" height="362" rx="17" fill="#ffffff" stroke="#cadbd4" stroke-width="1.5"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" fill="#193943" text-anchor="middle" font-weight="700">
  <text x="110" y="113" font-size="17">EIS data</text>
  <text x="310" y="113" font-size="17">GEP</text>
  <text x="510" y="113" font-size="16">ECM + uncertainty</text>
</g>

<!-- EIS Nyquist trace -->
<g stroke="#284b55" stroke-width="2.3" stroke-linecap="round" fill="none">
  <path d="M54 348 V191 M54 348 H173"/>
</g>
<path d="M65 340 C77 279 90 244 113 238 C139 232 165 274 175 340" fill="none" stroke="#ad4527" stroke-width="3.4" stroke-linecap="round"/>
<g fill="#ad4527" stroke="#fff" stroke-width="1.5">
  <circle cx="65" cy="340" r="4.4"/><circle cx="76" cy="298" r="4.4"/><circle cx="91" cy="266" r="4.4"/><circle cx="111" cy="240" r="4.4"/><circle cx="135" cy="244" r="4.4"/><circle cx="154" cy="273" r="4.4"/><circle cx="169" cy="310" r="4.4"/><circle cx="175" cy="340" r="4.4"/>
</g>
<g fill="#597076" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="14">
<text x="105" y="371">Z′</text><text x="41" y="281" transform="rotate(-90 41 281)">−Z″</text>
</g>

<!-- GEP expression tree: topology operators and circuit element terminals. -->
<g fill="none" stroke="#294b54" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M310 190 L269 253 M310 190 L348 253 M348 253 L325 313 M348 253 L370 313"/>
</g>
<g fill="#e7f0ec" stroke="#294b54" stroke-width="1.8">
  <circle cx="310" cy="183" r="20"/><circle cx="267" cy="260" r="19"/><circle cx="348" cy="260" r="19"/>
  <rect x="309" y="313" width="31" height="31" rx="6" fill="#fff"/><rect x="354" y="313" width="31" height="31" rx="6" fill="#fff"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" fill="#193943">
  <text x="310" y="190" font-size="22">+</text><text x="267" y="267" font-size="17">R</text><text x="348" y="267" font-size="21">/</text><text x="324.5" y="335" font-size="17">R</text><text x="369.5" y="335" font-size="17">C</text>
</g>
<text x="310" y="387" text-anchor="middle" fill="#697e7d" font-family="Arial, Helvetica, sans-serif" font-size="12">Circuit topology search</text>

<!-- Connectors -->
<g fill="#193d47">
  <circle cx="213.5" cy="251" r="15"/><circle cx="406.5" cy="251" r="15"/>
</g>
<g stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M207 251 H220 M216 246 L221 251 L216 256"/><path d="M400 251 H413 M409 246 L414 251 L409 256"/></g>

<!-- Final circuit, a simple R0-(R1 || C1) example -->
<g fill="none" stroke="#193d47" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M443 239 H451 L456 232 L462 246 L468 232 L474 246 L480 232 L485 239 H491"/>
  <path d="M491 239 V205 H511 M538 205 H568 V273 H539 M523 273 H491 V239 M568 239 H580"/>
  <rect x="511" y="196" width="27" height="18" rx="1"/>
  <path d="M523 261 V284 M539 261 V284"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" fill="#577075" font-size="13" font-style="italic">
  <text x="457" y="221">R₀</text><text x="517" y="190">R₁</text><text x="518" y="300">C₁</text>
</g>
<!-- Posterior distribution -->
<g>
  <path d="M453 381 C472 380 479 347 492 338 C505 328 517 333 529 351 C541 370 552 381 572 381 L572 383 L453 383 Z" fill="url(#curve)"/>
  <path d="M453 381 C472 380 479 347 492 338 C505 328 517 333 529 351 C541 370 552 381 572 381" stroke="#ad4527" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M451 383 H574" stroke="#a6b8b2" stroke-width="1.2"/>
</g>
</svg>
